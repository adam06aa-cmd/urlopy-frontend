<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>System Urlopowy – Logowanie Pracownika</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f0f4f8; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .card { width: 380px; border: none; box-shadow: 0 4px 20px rgba(0,0,0,.1); border-radius: 16px; }
    .card-header { background: #1976D2; color: #fff; border-radius: 16px 16px 0 0 !important; text-align: center; padding: 24px; }
    .switch-link { text-align: center; margin-top: 12px; font-size: .875rem; }
  </style>
</head>
<body>
  <div>
    <div class="card">
      <div class="card-header">
        <h4 class="mb-0">System Urlopowy</h4>
        <small>Panel pracownika</small>
      </div>
      <div class="card-body p-4">
        <div id="alert" class="alert d-none"></div>
        <div class="mb-3">
          <label class="form-label">Login lub email</label>
          <input type="text" id="email" class="form-control" placeholder="jkowalski lub email@firma.pl">
        </div>
        <div class="mb-4">
          <label class="form-label">Hasło</label>
          <input type="password" id="password" class="form-control">
        </div>
        <button id="btnLogin" class="btn btn-primary w-100">Zaloguj się</button>
      </div>
    </div>
    <div class="switch-link text-muted">
      Jesteś administratorem? <a href="login-admin.html">Zaloguj się tutaj</a>
    </div>
  </div>
  <script src="js/app.js"></script>
  <script>
    document.getElementById('btnLogin').addEventListener('click', async () => {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const alertEl = document.getElementById('alert');
      alertEl.className = 'alert d-none';

      if (!email || !password) {
        alertEl.className = 'alert alert-warning';
        alertEl.textContent = 'Wypełnij wszystkie pola';
        return;
      }

      try {
        const data = await API.login(email, password);
        if (data.success) {
          if (data.user.role === 'admin') {
            alertEl.className = 'alert alert-danger';
            alertEl.textContent = 'Administratorzy logują się przez osobną stronę.';
            return;
          }
          localStorage.setItem('token', data.token);
          localStorage.setItem('userName', data.user.name);
          localStorage.setItem('userRole', data.user.role);
          localStorage.setItem('userId', data.user.id);
          window.location.href = 'pracownik.html';
        } else {
          alertEl.className = 'alert alert-danger';
          alertEl.textContent = data.message || 'Błąd logowania';
        }
      } catch (e) {
        alertEl.className = 'alert alert-danger';
        alertEl.textContent = 'Błąd połączenia z serwerem';
      }
    });

    document.getElementById('password').addEventListener('keypress', e => {
      if (e.key === 'Enter') document.getElementById('btnLogin').click();
    });
  </script>
</body>
</html>
